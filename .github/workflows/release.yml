name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  macos:
    needs: [ci]
    uses: ./.github/workflows/macos.yml
    secrets: inherit
    permissions:
      contents: write

  android:
    needs: [ci]
    uses: ./.github/workflows/android.yml
    secrets: inherit
    permissions:
      contents: write

  cd:
    needs: [ci]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
