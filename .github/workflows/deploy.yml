name: Deploy static content to Pages

on:
  workflow_dispatch:
  workflow_call:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"
      # capacitor-hinge is a private git dependency; HINGE_DEPLOY_KEY is a
      # read-only deploy key on that repo.
      - name: Load capacitor-hinge deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.HINGE_DEPLOY_KEY }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify PostHog configuration
        run: |
          test -n "$VITE_POSTHOG_KEY" || { echo "::error::VITE_POSTHOG_KEY secret is missing"; exit 1; }
          test -n "$VITE_POSTHOG_HOST" || { echo "::error::VITE_POSTHOG_HOST secret is missing"; exit 1; }
      - name: Build
        run: pnpm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        # MUST stay on v3. v4's internal tar drops hidden entries
        # (.well-known, .nojekyll) — even with include-hidden-files:true —
        # which makes assetlinks.json 404 and re-shows the TWA browser header.
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload dist folder
          path: "./dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
